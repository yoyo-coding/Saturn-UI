syntax = "proto3";

option csharp_namespace = "SaturnUI.Protos";

package SaturnUI;

service ChatService {
  rpc Chat (ChatRequest) returns (stream ChatReply);
}

message ChatRequest {
  string message = 1;
  string conversation_id = 2;
}

message ChatReply {
  string content = 1;
  string token = 2;
  bool done = 3;
  string error = 4;
}
